name: Android CI/CD

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android_ci_cd.jks

      - name: Grant Permission
        run: chmod +x gradlew

      # ✅ NEW: Run Unit Tests
      - name: Run Unit Tests
        run: ./gradlew test

      # ✅ NEW: Run Lint Check (optional but recommended)
      - name: Run Lint
        run: ./gradlew lint

      - name: Build AAB
        run: ./gradlew bundleRelease

      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: com.ram.androidcidemo   # ⚠️ change this
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: draft   # ✅ ADD THIS